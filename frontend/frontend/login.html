<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="text-center">
      <div class="brand-mark">I</div>
      <span class="brand-name">Ink</span>
      <div class="auth-subtitle">Studio</div>
    </div>

    <form id="form-login">
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="E-mail" required>
      </div>
      <div class="mb-3">
        <input type="password" id="senha" class="form-control" placeholder="Senha" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <p class="mt-4 text-center mb-0 text-white-50">
      Não tem conta? <a class="auth-link" href="cadastro.html">Cadastre-se</a>
    </p>
  </div>

  <script>
    const formLogin = document.getElementById('form-login');

    formLogin.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();

      try {
        const resposta = await fetch('http://127.0.0.1:8000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha }),
        });

        const resultado = await resposta.json().catch(() => ({}));

        if (resposta.ok) {
          localStorage.setItem('token', resultado.access_token);
          window.location.href = 'dashboard.html';
          return;
        }

        alert('Erro ao entrar: ' + (resultado.erro || 'Credenciais inválidas'));
      } catch (erro) {
        console.error('Erro no login:', erro);
        alert('Não foi possível conectar com a API. Verifique se o backend está rodando em http://127.0.0.1:8000');
      }
    });
  </script>

</body>
</html>
